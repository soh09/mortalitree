# Stage B: RGB tree-dataset pretraining
model:
  neck_in_channels: 1024     # Clay v1.5 large embedding dim
  neck_out_channels: 128
  num_queries: 500           # >= max trees per tile; matches pipeline --max-trees 500 (gotcha #12)
  hidden: 128
  n_heads: 4
  n_decoder_layers: 3
  dropout: 0.1

training:
  total_epochs: 50
  batch_size: 16
  lr: 1.0e-3
  weight_decay: 0.05
  warmup_epochs: 5
  val_fraction: 0.1
  num_workers: 4

loss:
  lam_cls: 1.0
  lam_l1: 5.0
  lam_giou: 2.0

data:
  tile_size: 256       # source patch size on disk
  augment: true
  # Quartering experiment: split each 256 patch into n_split x n_split tiles
  # (2 -> 128 px) so trees-per-tile stays within the query budget Q while the
  # dense-forest patches a per-256 max_trees filter would drop are recovered.
  # Set quarter: false for the un-quartered 256 baseline (head-to-head).
  quarter: true
  n_split: 2           # 2 -> 128 px tiles (Q=150); try 4 -> 64 px (Q~40)
  max_trees: 150       # drop tiles over the query budget (0 = keep all)